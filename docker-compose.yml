version: '3.1'

services:
  matriculas-db:
    image: postgres:15
    container_name: matriculas-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin123
      POSTGRES_DB: matriculas
    ports:
      - "5432:5432"
    volumes:
      - matriculas-db-data:/var/lib/postgresql/data

  matriculas-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: matriculas-pgadmin
    depends_on:
      - matriculas-db
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matriculas.com
      PGADMIN_DEFAULT_PASSWORD: Admin123
    volumes:
      - matriculas-pgadmin-data:/var/lib/pgadmin

volumes:
  matriculas-db-data:
  matriculas-pgadmin-data: